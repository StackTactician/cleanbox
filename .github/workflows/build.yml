name: build Cleanbox
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/wrapper-validation-action@v2
      - run: |
          wget https://services.gradle.org/distributions/gradle-8.7-bin.zip -q
          unzip -q gradle-8.7-bin.zip
          export PATH=$PWD/gradle-8.7/bin:$PATH
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew
          ./gradlew assembleRelease --info
      - run: |
          sudo apt-get update && sudo apt-get install -y apksigner
          keytool -genkey -v -keystore debug.jks -storepass android -alias android -keypass android -keyalg RSA -validity 10000 -dname "CN=Cleanbox"
          apksigner sign --ks debug.jks --ks-pass pass:android --key-pass pass:android app/build/outputs/apk/release/app-release-unsigned.apk --out Cleanbox.apk
          apksigner verify Cleanbox.apk && echo "signed"
          ls -lh Cleanbox.apk
      - run: |
          gh release delete latest --yes || true
          git push --delete origin latest || true
          gh release create latest Cleanbox.apk --title "latest" --notes "Cleanbox.apk"
        env:
          GH_TOKEN: ${{ github.token }}
