name: build Cleanbox
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - uses: android-actions/setup-android@v3
      - run: |
          wget https://services.gradle.org/distributions/gradle-8.7-bin.zip -q
          unzip -q gradle-8.7-bin.zip
          export PATH=$PWD/gradle-8.7/bin:$PATH
          gradle wrapper --gradle-version 8.7 || true
          chmod +x gradlew || true
          cat gradle/wrapper/gradle-wrapper.properties | head -n 20
      - run: chmod +x gradlew
      - run: ./gradlew assembleRelease --info
      - run: |
          keytool -genkey -v -keystore debug.jks -storepass android -alias android -keypass android -keyalg RSA -validity 10000 -dname "CN=Cleanbox"
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign --ks debug.jks --ks-pass pass:android --key-pass pass:android app/build/outputs/apk/release/app-release-unsigned.apk --out Cleanbox.apk || apksigner sign --ks debug.jks --ks-pass pass:android --key-pass pass:android app/build/outputs/apk/release/app-release-unsigned.apk --out Cleanbox.apk
          ls -lh Cleanbox.apk
          $ANDROID_HOME/build-tools/34.0.0/apksigner verify Cleanbox.apk && echo "signed" || apksigner verify Cleanbox.apk && echo "signed"
      - run: |
          gh release delete latest --yes || true
          git push --delete origin latest || true
          gh release create latest Cleanbox.apk --title "latest" --notes "Cleanbox.apk"
        env:
          GH_TOKEN: ${{ github.token }}
