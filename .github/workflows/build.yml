name: build Cleanbox
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: sudo apt-get update && sudo apt-get install -y apktool apksigner
      - run: apktool b apk -o Cleanbox.apk
      - run: |
          keytool -genkey -v -keystore debug.jks -storepass android -alias android -keypass android -keyalg RSA -validity 10000 -dname "CN=Cleanbox" || true
          apksigner sign --ks debug.jks --ks-pass pass:android --key-pass pass:android Cleanbox.apk || apksigner sign --ks debug.jks --ks-pass pass:android Cleanbox.apk
          apksigner verify Cleanbox.apk && echo "signed"
      - uses: actions/upload-artifact@v4
        with:
          name: Cleanbox-apk
          path: Cleanbox.apk
